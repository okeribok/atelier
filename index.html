<header><b>ATELIER</b>
<button accesskey="0" title="Alt + 0" id=open>Open folder</button><button id=last hidden>Resume</button>
<input id=url size=22 title="llama.cpp server URL">
<button accesskey="1" id=yolo title="From the last change down to the code: reconcile everything, fix failing tests, until stable (ALT + 1)">YOLO</button><button accesskey="2" title="Alt + 2" id=run>Run tests</button><button accesskey="3" title="Alt + 3" id=sync>Check sync</button><button accesskey="4" id=chk title="Deterministic checks: syntax, references, format and invariants, tests (Alt + 4)">Checks</button><button accesskey="5" title="Alt + 5" id=mark>Mark synced</button><button id=snap>Snapshot</button>

<select id=eff title="Thinking effort for models that support it (Granite 4.2, Qwen3)"><option value=auto>think: auto</option><option value=off>think: off</option><option value=low>think: low</option><option value=high>think: high</option></select>

<button accesskey="8" title="Alt + 8" id=ping title="Check the model server: name, context size, round trip">Ping</button><button accesskey="9" title="Alt + 9" id=pack title="Copy every file as one Markdown packet">Packet</button><span id=lamp><i class=dot id=ld></i><span id=stat>idle</span></span></header>
<main>
<nav id=tree></nav>
<section><textarea id=ta spellcheck=false placeholder="Open an empty folder to bootstrap a project, or an existing Atelier folder."></textarea>
<div id=blast></div><div id=bar><input id=ask placeholder="Instruction for the model (optional)"><button id=prop>Ask model</button><button id=dia>Diagram</button></div></section>

</main>
<script>
const $=i=>document.getElementById(i),h=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);e.append(...k);return e};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const H=s=>{let x=5381;for(let i=0;i<s.length;i++)x=(x*33^s.charCodeAt(i))>>>0;return x.toString(36)};
const lamp=(k,t)=>{$('ld').className='dot s-'+k;$('stat').textContent=t};   // status lamp: w thinking, g done, a needs you, r error
let root,cur,files={},S={base:{},seen:{}},busy=false,stop=false;
const out=$('out'),con=$('con'),say=(...k)=>{const d=h('div',{className:'row'},...k);out.append(d);out.scrollTop=1e9;return d};

// ---------- seed project (written on first open); ~~~ becomes a code fence ----------
const SEED={
'story.md':`# Tally
Tally is a tiny web page with a big number and two buttons. It starts at zero. Pressing "+" adds one, pressing "-" takes one away, and the number never goes below zero. It should feel instant and stay easy to read.
`,
'spec.md':`S1: The counter starts at 0.
S2: Pressing "+" increases the counter by 1.
S3: Pressing "-" decreases the counter by 1.
S4: The counter never goes below 0.
`,
'atelier.md':`# Atelier rules
Goal: a small client-side HTML/CSS/JS app with no build step.
- No frameworks or libraries unless the story asks for one; prefer browser APIs.
- Plain JavaScript snippets only: no imports, no network calls.
- Keep every snippet small enough for a newcomer to read in a minute.
- Keep existing behaviour and public function names unless the story asks for a change.
`,
'quality.md':`Q1 [3] maintainability: a newcomer can read every part in a minute.
Q2 [2] latency: a button press is reflected on screen within 50 ms.
Q3 [1] extensibility: new behaviours (reset, step size) can be added without rewriting existing parts.
`,
'decisions.md':`## D1: State model
drivers: Q1 Q3 S4
options:
- pure: plain functions and one variable in the UI; smallest and easiest to test
- oo: a Counter class; easier to extend with new behaviours
chosen: pure
stage: works
why: One behaviour so far, so plain functions keep it the most readable.
affects: step

## D2: Where the counter is stored
drivers: S1 Q2
options:
- memory: only while the page is open
- local: browser local storage
- disk: a file through the File System Access API
- remote: a database behind an API
chosen: memory
stage: stub
why: The spec never asks for the number to survive a reload.
affects: ui
avoid: localStorage, indexedDB
`,
'arch.md':`# Architecture
A pure state function (step) and a thin UI layer (ui) that owns the number and the buttons.

~~~mermaid
flowchart LR
  click[button click] --> ui[ui: draws number and buttons]
  ui --> step[step: pure state transition]
  step --> ui
~~~
`,
'pseudo.md':`# Pseudocode
1. state = 0
2. @step: given state and a button ("+" or "-"), return the new state, never below 0
3. @ui: draw the number and two buttons; on click, state = step(state, button) and redraw
`,
'snippets/step.js':`// covers: S2 S3 S4
function step(n, b) { return b === '+' ? n + 1 : Math.max(0, n - 1); }
`,
'snippets/step~oo.js':`// covers: S2 S3 S4 (variant for D1=oo, same interface as step.js)
class Counter {
  constructor(n = 0) { this.n = n; }
  press(b) { this.n = b === '+' ? this.n + 1 : Math.max(0, this.n - 1); return this; }
}
function step(n, b) { return new Counter(n).press(b).n; }
`,
'snippets/step.test.js':`t('plus adds one', () => eq(step(0, '+'), 1));
t('minus subtracts one', () => eq(step(3, '-'), 2));
t('never below zero', () => eq(step(0, '-'), 0));
`,
'snippets/ui.js':`// covers: S1 S2 S3
let n = 0;
const out = document.createElement('div');
out.id = 'n';
out.style.cssText = 'font:700 4rem system-ui;text-align:center';
const bar = document.createElement('div');
bar.style.textAlign = 'center';
for (const b of ['-', '+']) {
  const el = document.createElement('button');
  el.textContent = b;
  el.style.cssText = 'font-size:2rem;margin:.5rem';
  el.onclick = () => { n = step(n, b); draw(); };
  bar.append(el);
}
function draw() { out.textContent = n; }
document.body.append(out, bar);
draw();
`,
'snippets/ui.test.js':`t('shows a number', () => eq(document.getElementById('n').textContent, '0'));
t('has two buttons', () => eq(document.querySelectorAll('button').length, 2));
`,
'tests/app.test.js':`// end-to-end, runs in order against the assembled app
const _click = l => [...document.querySelectorAll('button')].find(b => b.textContent === l).click();
const _val = () => document.getElementById('n').textContent;
t('S1 starts at 0', () => eq(_val(), '0'));
t('S2 plus increases', () => { _click('+'); eq(_val(), '1'); });
t('S3 minus decreases', () => { _click('-'); eq(_val(), '0'); });
t('S4 never below 0', () => { _click('-'); eq(_val(), '0'); });
`,
'tests/quality.test.js':`// fitness functions: one check per measurable quality goal
t('Q2 a press shows within 50 ms', () => {
  const b = [...document.querySelectorAll('button')].find(x => x.textContent === '+');
  const t0 = performance.now(); b.click();
  const ms = performance.now() - t0;
  if (ms > 50) throw Error(ms.toFixed(1) + ' ms');
});
`};
for(const k in SEED)SEED[k]=SEED[k].replaceAll('~~~','```');

// ---------- disk (File System Access API, Chrome/Edge) ----------
const idb=(m,...a)=>new Promise((ok,no)=>{const q=indexedDB.open('atelier',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>no(q.error);q.onsuccess=()=>{const r=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k')[m](...a);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}});
const fh=async(p,c)=>{const a=p.split('/');let d=root;for(const s of a.slice(0,-1))d=await d.getDirectoryHandle(s,{create:c});return d.getFileHandle(a.at(-1),{create:c})};
const rd=async p=>{try{return await(await(await fh(p)).getFile()).text()}catch{return null}};
const wr=async(p,s)=>{const w=await(await fh(p,1)).createWritable();await w.write(s);await w.close();if(/\.(md|js)$/.test(p)&&p[0]!='.')files[p]=s};
const rm=async p=>{const a=p.split('/');let d=root;for(const s of a.slice(0,-1))d=await d.getDirectoryHandle(s);await d.removeEntry(a.at(-1))};
const save=()=>wr('.atelier/state.json',JSON.stringify(S));
async function scan(d=root,pre=''){for await(const[n,x]of d.entries()){if(n[0]=='.'||n=='node_modules')continue;if(x.kind=='directory')await scan(x,pre+n+'/');else if(/\.(md|js)$/.test(n))files[pre+n]=await(await x.getFile()).text()}}

// ---------- the graph: which files must agree with which ----------
const refs=()=>[...new Set([...(files['pseudo.md']||'').matchAll(/@([\w-]+)/g)].map(m=>m[1]).filter(i=>i!='id'&&i!='name'))];
const decs=()=>(files['decisions.md']||'').split(/^## /m).slice(1).map(b=>{const g=k=>(new RegExp('^'+k+':[ \\t]*(.*)$','m').exec(b)||[])[1]?.trim()||'';
  const chosen=g('chosen'),esc=chosen.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),optLine=(new RegExp('^- '+esc+':(.*)$','m').exec(b)||[])[1]||'';
  return{id:b.split(':')[0].trim(),chosen,stage:g('stage'),affects:g('affects').split(/[\s,]+/).filter(Boolean),avoid:g('avoid').split(/\s*,\s*/).filter(Boolean),
    opts:[...b.matchAll(/^- ([\w-]+):/gm)].map(m=>m[1]),url:(/https?:\/\/\S+/.exec(optLine)||[])[0]||''}});
const sp=id=>{for(const d of decs()){const p=`snippets/${id}~${d.chosen}.js`;if(files[p]!=null)return p}return`snippets/${id}.js`};  // active variant, else base
const edges=()=>{const E=[['story.md','spec.md'],['story.md','quality.md'],['spec.md','quality.md'],['spec.md','arch.md'],['spec.md','decisions.md'],['quality.md','decisions.md'],['decisions.md','arch.md'],['arch.md','pseudo.md'],
    ['spec.md','tests/app.test.js'],['pseudo.md','tests/app.test.js'],['quality.md','tests/quality.test.js'],['pseudo.md','tests/quality.test.js']];
  for(const i of refs()){const c=sp(i),t=`snippets/${i}.test.js`;E.push(['pseudo.md',c],[c,t],['spec.md',c],['spec.md',t])}
  for(const d of decs())for(const i of d.affects)E.push(['decisions.md',sp(i)]);return E};
const adj=p=>edges().flatMap(([a,b])=>a==p?[b]:b==p?[a]:[]);
const sig=p=>H(adj(p).sort().map(q=>q+'\0'+(files[q]??'')).join('\0'));   // fingerprint of a file's neighbours
const stale=p=>adj(p).length>0&&S.seen[p]!==sig(p);                       // a neighbour changed since p was last reviewed
const changed=p=>files[p]!==S.base[p];                                     // p differs from last sync

function diff(a,b){a=a.split('\n');b=b.split('\n');const L=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0;const o=[];while(i<a.length&&j<b.length){if(a[i]===b[j]){o.push(['=',a[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push(['-',a[i++]]);else o.push(['+',b[j++]])}
  while(i<a.length)o.push(['-',a[i++]]);while(j<b.length)o.push(['+',b[j++]]);return o}
const dsize=(a,b)=>diff(a,b).filter(x=>x[0]!='=').length;
const dtxt=(a,b)=>diff(a,b).filter(x=>x[0]!='=').map(x=>x[0]+' '+x[1]).join('\n');
const dhtml=(a,b)=>diff(a,b).filter(x=>x[0]!='=').map(x=>`<span class=${x[0]=='+'?'a':'d'}>${x[0]} ${esc(x[1])}</span>`).join('\n');

// ---------- llama.cpp (OpenAI-compatible, streamed) ----------
$('url').value=localStorage.atelierurl||'http://localhost:8080';$('url').onchange=e=>localStorage.atelierurl=e.target.value;
$('eff').value=localStorage.ateliereff||'auto';$('eff').onchange=e=>localStorage.ateliereff=e.target.value;
let trunc=false;
async function llm(sys,user,o={}){
  calls++;let e=o.eff||$('eff').value;if(e=='auto')e='off';const think=e!='off',{temp=.2,max=800,stop}=o;
  const r=await fetch($('url').value.replace(/\/$/,'')+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:sys},{role:'user',content:user}],
    temperature:think?Math.max(temp,.6):temp,max_tokens:max+(e=='high'?3000:e=='low'?1500:0),stop,stream:true,reasoning_effort:e=='off'?'none':e=='low'?'low':undefined,chat_template_kwargs:{enable_thinking:think,low_effort:e=='low'}})});
  if(!r.ok)throw Error('HTTP '+r.status);
  let out='',buf='',fr='';const rdr=r.body.getReader(),dec=new TextDecoder();
  for(;;){const{done,value}=await rdr.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls)if(l.startsWith('data: ')&&l!='data: [DONE]'){try{const c=JSON.parse(l.slice(6)).choices[0];out+=c.delta?.content||'';fr=c.finish_reason||fr}catch{}}
    lamp('w',(think?'thinking… ':'writing… ')+out.length)}
  trunc=fr=='length';
  return out.replace(/^[\s\S]*?<\/think>/,'').replace(/<think>[\s\S]*$/,'').trim()}

// Layers give the graph a direction. YOLO only ever flows downward, so two files can never overwrite each other in turn.
const rank=p=>p=='story.md'?0:p=='spec.md'?1:p=='quality.md'?2:p=='decisions.md'?3:p=='arch.md'?4:p=='pseudo.md'?5:/\.test\.js$/.test(p)?6:/^snippets\//.test(p)?7:9;
const down=p=>adj(p).filter(q=>rank(q)>rank(p));
const norm=s=>s.replace(/\s+/g,' ').trim();
const netOK=()=>/allow network/i.test(files['atelier.md']||'');
const libs=()=>netOK()?[...new Set(decs().map(d=>d.url).filter(Boolean))]:[];   // a chosen decision option may end its description with a script URL to load a library
const mkmsg=p=>/~/.test(p)?'This variant does not exist yet. Write it for the chosen option in decisions.md, keeping the same public interface as the base snippet so the shared tests still pass.':'This file does not exist yet. Create it from the related files.';
const missing=()=>[...refs().flatMap(i=>[sp(i),`snippets/${i}.test.js`]),...decs().flatMap(d=>d.chosen&&d.chosen!==d.opts[0]?d.affects.map(i=>`snippets/${i}~${d.chosen}.js`):[])].filter(p=>files[p]==null);
const B='=====BEGIN=====',E='=====END=====';
const FMT=p=>({
 'story.md':'A "# Title" line, then 2 to 6 plain sentences for non-technical readers. No lists, no bold, no file names, no remarks about the story itself.',
 'spec.md':'Only lines of the form "S1: <one short sentence>" with consecutive numbers. Nothing else.',
 'quality.md':'Only lines of the form "Q1 [3] <name>: <one short sentence>" where [1-5] is the weight. Nothing else.',
 'decisions.md':'Blocks separated by one blank line. Each block: "## D1: <title>", "drivers: <ids>", "options:", two to four lines "- <key>: <description>", "chosen: <key>", "stage: stub|works|tuned", "why: <one sentence>", "affects: <snippet names, or nothing>", optionally "avoid: <comma-separated code fragments the affected snippets must not contain>". An option\'s description may end with a library\'s script URL (https://...) to load it when that option is chosen; loaded only if atelier.md says "allow network".',
 'arch.md':'"# Architecture", at most 3 sentences, then exactly one ```mermaid flowchart block with at most 8 nodes. Nothing else.',
 'pseudo.md':'"# Pseudocode", then numbered steps "1. ...". A step that becomes a code snippet starts with "@<name>:" using existing names ('+(refs().join(', ')||'short lowercase names')+'). No code, no remarks.'
}[p]||(/\.test\.js$|^tests\//.test(p)?'Only JavaScript: calls of t("name", () => ...) that use eq(actual, expected). No imports, no markdown, no remarks.':'Only plain browser JavaScript with top-level declarations. The first line is "// covers: S1 S2". Keep the public function names, signatures and element ids that the tests use. No markdown fences, no remarks.'));
const CTX='Project parts: story.md (narrative), spec.md (S-claims), quality.md (Q-goals), decisions.md (ADR blocks), arch.md, pseudo.md (@name steps that map to snippets), snippets/*.js, tests.';
const SYSR=CTX+' You review ONE file against its related files. Reply with a numbered list (at most 8 lines, one short line each) of concrete inconsistencies or errors that require changing that file, naming the exact claim, line or function. If the file already agrees with the related files, reply with exactly: NONE. Never rewrite the file.';
const SYSP=CTX+' You plan a change to ONE file. Reply with a numbered list (at most 6 short lines) of the exact changes to make, naming the functions, lines or claims. Never write the file itself.';
const SYSW=p=>`You output ONE complete file and nothing else. Required format: ${FMT(p)}\nReply exactly like this, with no text before or after:\n${B}\n<file content>\n${E}`;
const SYS2='Write 2-4 plain sentences for non-technical readers describing how the app changed, based on these diffs. No jargon and no file names.';

let calls=0,work=null,Q=new Set(),pending=new Map(),bads=new Set(),lastPlan='';
const parse=(t,p)=>{const i=t.indexOf(B);let r=i<0?t:t.slice(i+B.length);const j=r.indexOf(E);if(j>=0)r=r.slice(0,j);r=r.trim();
  const m=/^```\w*\n([\s\S]*)\n```$/.exec(r);if(m&&!/^```mermaid/.test(r))r=m[1];return r+'\n'};
const bad=(p,r)=>{const L=r.split('\n').filter(l=>l.trim());if(!L.length)return'empty';
  if(p=='spec.md'&&L.some(l=>!/^S\d+: ./.test(l)))return'every line must look like "S1: ..."';
  if(p=='quality.md'&&L.some(l=>!/^Q\d+ \[[1-5]\] [^:]+: ./.test(l)))return'every line must look like "Q1 [3] name: ..."';
  if(p=='decisions.md'&&(!/^## D\d+:/.test(L[0])||!/^chosen:/m.test(r)))return'needs "## D1: title" blocks with a chosen: line';
  if(p=='arch.md'&&!/```mermaid\n[\s\S]*\n```/.test(r))return'needs one mermaid block';
  if(p=='pseudo.md'&&(!/^# /.test(L[0])||L.some(l=>!/^(# |\d+\. )/.test(l))))return'lines must be "# title" or numbered steps';
  if(p=='story.md'&&(/^\s*([-*]|\d+\.) /m.test(r)||/\.(md|js)\b|\*\*/.test(r)||r.length>Math.max(700,(files[p]||'').length*1.5)))return'must be a short plain paragraph without lists or file names';
  if(/\.js$/.test(p)){if(/^```/m.test(r))return'contains a code fence';try{new Function(r)}catch(e){return'syntax error: '+e.message}
    if(/\.test\.js$|^tests\//.test(p)){if(!/\bt\(/.test(r))return'must call t(name, fn)'}else{if(!/^\/\/ covers:/.test(r))return'first line must be "// covers: ..."';
      if(/^\s*import\s|\brequire\(/m.test(r))return'imports are not allowed (see atelier.md)';
      if(/['"`]https?:\/\//.test(r)&&!netOK())return'network URLs are not allowed (see atelier.md)';
      const id=(/^snippets\/([\w-]+)/.exec(p)||[])[1],av=decs().filter(d=>d.affects.includes(id)).flatMap(d=>d.avoid.map(a=>[d.id,a])).find(([,a])=>r.includes(a));if(av)return`violates ${av[0]} (avoid ${av[1]})`}}
  return''};
// Two passes: (1) a review or plan, allowed to be wordy but capped; (2) the file itself, in a strict format, checked before it is accepted.
async function ask(p,extra,up,temp,mode){   // returns the new content, or null when no change is needed
  mode=mode||(files[p]==null?'create':extra?'do':'review');

$('dia').onclick=async()=>{const m=/```mermaid\n([\s\S]*?)```/.exec(files['arch.md']||'');if(!m)return say('No mermaid block in arch.md');
  try{const{default:mm}=await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');mm.initialize({startOnLoad:false});say(h('div',{innerHTML:(await mm.render('g'+Date.now(),m[1])).svg}))}catch(e){say('Mermaid failed: '+e.message)}};

$('wf').onchange=async e=>{const v=e.target.value;e.target.value='';await savecur();
  if(v=='promote')propose('decisions.md','Promote "stage" one step (stub to works, works to tuned) only for decisions whose affected snippets and tests look complete and correct. Leave the others unchanged and say why in why:.');
  if(v=='tests')propose('tests/app.test.js','Make sure every claim in spec.md has at least one test whose name starts with its id, for example "S4 ...". Add the missing ones and keep the existing ones.');

$('pack').onclick=async()=>{const t=layout().map(([n,p])=>`\n===== ${n} ${p} =====\n${files[p]}`).join('\n');try{await navigator.clipboard.writeText(t);say('Packet copied: '+t.length+' characters.')}catch{console.log(t);say('Clipboard blocked; the packet is in the console.')}};
async function checks(){out.replaceChildren(...[...pending.values()].map(x=>x.card));say(h('b',{},'Checks'));const row=(n,ok,d)=>say(h('span',{className:ok?'a':'d'},(ok?'✓ ':'✗ ')+n+(d?': '+d:'')));
  const ps=Object.keys(files).filter(p=>!/^(atelier|changelog)\.md$/.test(p)),fm=ps.map(p=>[p,bad(p,files[p])]).filter(x=>x[1]),ms=missing();
  row('Format and invariants',!fm.length,fm.map(x=>x.join(' ')).join('; '));row('References resolve, tests exist',!ms.length,ms.join(', '));
  lamp('w','running tests');const fl=fails(await runAll());lamp('','idle');
  row('Unit tests',!fl.some(f=>f.unit),fl.filter(f=>f.unit).map(f=>f.n).join(', '));row('App tests',!fl.some(f=>f.p=='tests/app.test.js'),'');
  row('Quality (fitness)',!fl.some(f=>f.p=='tests/quality.test.js'),fl.filter(f=>f.p=='tests/quality.test.js').map(f=>f.n+' '+(f.err||'')).join(', '));row('Browser console',!fl.some(f=>f.p=='console'),fl.filter(f=>f.p=='console').map(f=>f.n).join(', '));
  const req=[...new Set(decs().map(d=>d.url).filter(Boolean))];
  row('Libraries',netOK()||!req.length,libs().join(', ')||(req.length?'requested but network not allowed in atelier.md: '+req.join(', '):'none'))}
async function ping(){const u=$('url').value.replace(/\/$/,''),t0=performance.now();let pr={};try{pr=await(await fetch(u+'/props')).json()}catch{}
  try{const a=await llm('Reply with the single word: ok','ping',{max:8,eff:'off'}),g=pr.default_generation_settings||{};
    say(h('span',{className:'a'},`✓ ${pr.model_alias||pr.model_path||'model server'}, context ${g.n_ctx??pr.n_ctx??'unknown'}, round trip ${((performance.now()-t0)/1000).toFixed(1)} s, reply "${a.slice(0,20)}"`))}
  catch(e){say(h('span',{className:'d'},'✗ '+e.message+' (is llama-server running at '+u+'?)'))}lamp('','idle')}
$('chk').onclick=async()=>{await savecur();checks()};$('ping').onclick=ping;
$('yeet').onclick=yeet;$('accall').onclick=accAll;
addEventListener('keydown',e=>{if(e.key=='Escape'&&busy)stop=true;if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)&&pending.size)accAll()});

// ---------- open / bootstrap ----------
async function load(){files={};await scan();
  if(files['story.md']==null){for(const p in SEED)await wr(p,SEED[p]);fetch(location.href).then(r=>r.text()).then(t=>wr('atelier.html',t)).catch(()=>{});say('Bootstrapped a new project in this folder.')}
  if(files['atelier.md']==null)await wr('atelier.md',SEED['atelier.md']);
  S=JSON.parse(await rd('.atelier/state.json')||'null')||{base:{...files},seen:{}};
  if(!Object.keys(S.seen).length){for(const p in files)S.seen[p]=sig(p);await save()}
  S.base['atelier.md']??=files['atelier.md'];await snaps();await render();pick('story.md');say('Ready. Run tests to verify, or edit story.md and Check sync.')}
$('open').onclick=async()=>{try{root=await showDirectoryPicker({mode:'readwrite'});await idb('put',root,'root');await load()}catch(e){say(e.message)}};
$('last').onclick=async()=>{try{root=await idb('get','root');if(await root.requestPermission({mode:'readwrite'})=='granted')await load()}catch(e){say(e.message)}};
idb('get','root').then(x=>{if(x){$('last').hidden=false;$('last').textContent='Resume '+x.name}}).catch(()=>{});
if(!window.showDirectoryPicker)say('This browser lacks the File System Access API. Use Chrome or Edge.');
